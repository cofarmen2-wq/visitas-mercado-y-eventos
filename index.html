<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Visitas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería Html5Qrcode para escáner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="app-container" id="appContainer">
    <div class="header">
      <img src="LOGO P1.png" alt="Logo" class="logo" id="appLogo">
      <h1 id="appTitle">Registro de Visitas</h1>
    </div>

    <!-- Panel de Selección de Modo -->
    <div class="form-group">
      <label for="modoApp">Modo de Operación:</label>
      <select id="modoApp" class="form-control">
        <option value="normal">Visita Normal</option>
        <option value="mercadolibre">Mercado Libre</option>
        <option value="evento">Evento</option>
        <option value="preinvitados">Preinvitados</option>
      </select>
    </div>

    <!-- Configuración para Modo Evento -->
    <div id="panelEventoConfig" class="panel-especial" style="display: none;">
      <h3>Configuración de Evento</h3>
      <div class="form-group">
        <label for="nombreEvento">Nombre del Evento:</label>
        <input type="text" id="nombreEvento" class="form-control" placeholder="Ej: Conferencia 2026">
      </div>
    </div>

    <!-- Buscador / Selector Preinvitados -->
    <div id="groupPreinvitados" class="form-group" style="display: none;">
      <label for="selectPreinvitado">Buscar Preinvitado:</label>
      <select id="selectPreinvitado" class="form-control">
        <option value="">-- Seleccionar de la lista --</option>
      </select>
    </div>

    <!-- Escáner QR -->
    <div id="groupScanner" class="form-group">
      <label>Escanear QR / DNI:</label>
      <div id="reader"></div>
      <span class="status-text" id="qrStatus">Cámara inactiva</span>
      <div class="button-group-inline">
        <button type="button" id="btnStartQR" class="btn btn-secondary">Iniciar Cámara</button>
        <button type="button" id="btnStopQR" class="btn btn-danger" style="display: none;">Detener</button>
      </div>
    </div>

    <!-- Formulario Datos del Visitante -->
    <form id="formVisita">
      <div class="form-group">
        <label for="dni">DNI / Documento:</label>
        <input type="text" id="dni" class="form-control" placeholder="Número de documento" required>
      </div>

      <div class="form-group">
        <label for="nombre">Nombre y Apellido:</label>
        <input type="text" id="nombre" class="form-control" placeholder="Nombre completo" required>
      </div>

      <div id="groupSector" class="form-group">
        <label for="sector">Sector a Visitar:</label>
        <select id="sector" class="form-control">
          <option value="">-- Seleccionar Sector --</option>
        </select>
      </div>

      <div id="groupAnfitrion" class="form-group">
        <label for="anfitrion">Anfitrión / Contacto:</label>
        <select id="anfitrion" class="form-control">
          <option value="">-- Seleccionar Anfitrión --</option>
        </select>
      </div>

      <div id="groupBultos" class="form-group">
        <label for="bultos">Bultos / Equipaje:</label>
        <input type="text" id="bultos" class="form-control" placeholder="Ej: 1 Mochila, Laptop">
      </div>

      <div class="form-group">
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" class="form-control" rows="2" placeholder="Notas adicionales..."></textarea>
      </div>

      <div class="button-container">
        <button type="submit" id="btnGuardar" class="btn btn-primary btn-block">Registrar Ingreso</button>
        <button type="button" id="btnWhatsApp" class="btn btn-whatsapp btn-block" style="display: none;">Avisar por WhatsApp</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
