<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Visitas y Eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-container">
        <img src="LOGO P1 APP.png" alt="Logo" class="app-logo">
        <h1>Registro de Visitas</h1>
      </div>
      <button id="btnToggleModo" class="btn-secondary">Modo Evento</button>
    </header>

    <main>
      <!-- Campo del filtro desplegable -->
      <div class="form-group">
        <label for="buscarPreinvitado">🔍 Buscar Preinvitado:</label>
        <input 
          type="text" 
          id="buscarPreinvitado" 
          list="listaPreinvitados" 
          placeholder="Escriba un nombre para desplegar lista..."
          autocomplete="off"
        >
        <datalist id="listaPreinvitados">
          <!-- Opciones cargadas dinámicamente -->
        </datalist>
      </div>

      <form id="formRegistro">
        <div class="form-group">
          <label for="datosPersonales">Nombre y Apellido / DNI *</label>
          <input type="text" id="datosPersonales" required placeholder="Ej: Juan Pérez - 30123456">
        </div>

        <div class="form-group">
          <label for="empresa">Empresa</label>
          <input type="text" id="empresa" placeholder="Empresa de origen">
        </div>

        <div class="form-group">
          <label for="sector">Sector de Destino</label>
          <select id="sector">
            <option value="">Seleccione un sector...</option>
            <option value="PLANTA LOGISTICA">PLANTA LOGISTICA</option>
            <option value="CAPITAL HUMANO">CAPITAL HUMANO</option>
            <option value="Gerencia">Gerencia</option>
            <option value="Administracion">Administracion</option>
            <option value="Comercial">Comercial</option>
            <option value="Cajas">Cajas</option>
            <option value="Sistemas">Sistemas</option>
            <option value="Recepcion Técnica">Recepcion Técnica</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="EVENTO">EVENTO</option>
          </select>
        </div>

        <div class="form-group">
          <label for="anfitrion">Anfitrión</label>
          <input type="text" id="anfitrion" placeholder="Persona a visitar">
        </div>

        <div class="form-group">
          <label for="bultos">Bultos / Pertenencias</label>
          <input type="text" id="bultos" placeholder="Ej: 1 mochila, 1 laptop">
        </div>

        <div class="form-group">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" rows="3" placeholder="Detalles adicionales..."></textarea>
        </div>

        <button type="submit" id="btnGuardar" class="btn-primary">Registrar Ingreso</button>
      </form>

      <div id="mensajeEstado" class="mensaje-oculto"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
