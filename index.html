<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso y Visitas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería para lectura de QR y PDF417 (DNI) -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

  <div class="container">
    <header class="app-header">
      <img src="LOGO P1 APP.png" alt="Logo App" class="logo">
      <h1>Registro de Ingreso</h1>
    </header>

    <!-- Seleccionador de Modo -->
    <div class="form-group modo-container">
      <label for="modoApp">Modo de Operación:</label>
      <select id="modoApp">
        <option value="normal">Visita Normal</option>
        <option value="mercadolibre">Mercado Libre / Cadetería</option>
        <option value="evento">Evento Especial</option>
        <option value="preinvitados">Lista Preinvitados</option>
      </select>
    </div>

    <!-- Panel Dinámico: Configuración de Evento -->
    <div id="panelEventoConfig" class="panel-dinamico hidden">
      <h3>🎉 Datos del Evento</h3>
      <div class="form-group">
        <label for="nombreEvento">Nombre del Evento / Conferencia:</label>
        <input type="text" id="nombreEvento" placeholder="Ej: Capacitación Anual 2026">
      </div>
    </div>

    <!-- Panel Dinámico: Búsqueda de Preinvitados -->
    <div id="grouppreinvitados" class="panel-dinamico hidden">
      <h3>🔍 Buscar Preinvitado</h3>
      <div class="form-group">
        <input type="text" id="buscarPreinvitado" placeholder="Escriba el nombre para buscar en la lista...">
      </div>
    </div>

    <!-- Escáner QR / DNI -->
    <div class="scanner-section">
      <div id="qr-reader"></div>
      <div id="qrStatus">Cámara inactiva</div>
      <div class="scanner-buttons">
        <button type="button" id="btnStartQR" class="btn btn-secondary">📷 Escanear DNI / QR</button>
        <button type="button" id="btnStopQR" class="btn btn-danger hidden">Detener Cámara</button>
      </div>
    </div>

    <!-- Formulario Principal -->
    <form id="formVisita">
      <div class="form-group">
        <label for="dni">DNI / Documento:</label>
        <input type="text" id="dni" required placeholder="Número de Documento">
      </div>

      <div class="form-group">
        <label for="nombre">Nombre y Apellido:</label>
        <input type="text" id="nombre" required placeholder="Nombre completo">
      </div>

      <div class="form-group">
        <label for="empresa">Empresa / Procedencia:</label>
        <input type="text" id="empresa" placeholder="Empresa o particular">
      </div>

      <div class="form-group">
        <label for="sector">Sector a Visitar:</label>
        <select id="sector" required>
          <option value="">-- Seleccionar Sector --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="anfitrion">Anfitrión / Responsable:</label>
        <select id="anfitrion" required>
          <option value="">-- Seleccionar Anfitrión --</option>
        </select>
      </div>

      <!-- Campo de Bultos (Especialmente visible/útil para Mercado Libre) -->
      <div class="form-group" id="groupBultos">
        <label for="bultos">Cantidad de Bultos / Paquetes:</label>
        <input type="number" id="bultos" min="0" placeholder="0">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Registrar Ingreso</button>
        <button type="button" id="btnWhatsApp" class="btn btn-success hidden">📲 Notificar por WhatsApp</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
