<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Visitas Mercado y Eventos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <div class="app-container">
    <h2>Registro de Visitas</h2>

    <div class="form-group">
      <label for="modoApp"><i class="fa-solid fa-sliders"></i> Modo de Aplicación</label>
      <select id="modoApp" onchange="cambiarModoApp(this.value)">
        <option value="normal">Normal</option>
        <option value="mercadolibre">Mercado Libre</option>
        <option value="evento">Evento</option>
      </select>
    </div>

    <div id="panelEventoConfig" class="panel-evento" style="display: none;">
      <div class="form-group">
        <label for="nombreEvento"><i class="fa-solid fa-calendar-day"></i> Nombre del Evento</label>
        <input type="text" id="nombreEvento" placeholder="Ej: Convención 2026">
        <div class="button-group">
          <button type="button" class="btn-secundario" onclick="guardarNombreEvento()">Fijar Evento</button>
          <button type="button" class="btn-peligro" onclick="borrarNombreEvento()">Borrar</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <button type="button" class="btn-escaneo" onclick="iniciarEscaneo()"><i class="fa-solid fa-qrcode"></i> Escanear QR / DNI</button>
      <div id="reader"></div>
      <span id="scannerStatus">Lector Listo</span>
      <input type="text" id="escaneoRaw" placeholder="Lectura manual o barcode..." style="margin-top: 8px;">
    </div>

    <div class="form-group">
      <label for="datosPersonales"><i class="fa-solid fa-id-card"></i> Datos Personales</label>
      <input type="text" id="datosPersonales" placeholder="Nombre y DNI">
    </div>

    <div class="form-group">
      <label for="empresa"><i class="fa-solid fa-building"></i> Empresa</label>
      <input type="text" id="empresa" placeholder="Empresa de origen">
    </div>

    <div class="form-group">
      <label for="sector"><i class="fa-solid fa-sitemap"></i> Sector</label>
      <select id="sector" onchange="actualizarAnfitriones()">
        <option value="">Seleccione un sector...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="anfitrion" id="lblAnfitrion"><i class="fa-solid fa-user-tie"></i> Anfitrión / Quien Recibe</label>
      <select id="anfitrion">
        <option value="">Seleccione anfitrión...</option>
      </select>
    </div>

    <div class="form-group" id="groupBultos" style="display: none;">
      <label for="cantidadBultos"><i class="fa-solid fa-box"></i> Cantidad de Bultos</label>
      <input type="number" id="cantidadBultos" value="1" min="1">
    </div>

    <div class="form-group">
      <label for="observaciones"><i class="fa-solid fa-comment"></i> Observaciones</label>
      <input type="text" id="observaciones" placeholder="Detalles adicionales">
    </div>

    <button type="button" class="btn-primario" onclick="registrarIngreso()"><i class="fa-solid fa-floppy-disk"></i> Registrar Ingreso</button>
    <button type="button" id="btnWhatsApp" class="btn-wa" onclick="enviarWhatsApp()" style="display: none;"><i class="fa-brands fa-whatsapp"></i> Enviar Aviso WhatsApp</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
