<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitas Mercado y Eventos</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería HTML5 QR Code para el escáner de cámara -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

  <div class="container">
    <header class="header">
      <img src="LOGO P1 APP.png" alt="Logo App" class="logo">
      <h1>Registro de Visitas y Eventos</h1>
    </header>

    <main>
      <!-- Selección de Modo de Uso -->
      <section class="card">
        <label for="modoApp"><strong>Modo de Uso:</strong></label>
        <select id="modoApp">
          <option value="normal">Visita Normal</option>
          <option value="evento">Evento</option>
          <option value="preinvitados">Lista Preinvitados</option>
        </select>
      </section>

      <!-- Panel Configuración de Evento (Visibilidad según modo) -->
      <section id="panelEventoConfig" class="card hidden">
        <h2>Configuración del Evento</h2>
        <div class="form-group">
          <label for="nombreEvento">Nombre del Evento:</label>
          <input type="text" id="nombreEvento" placeholder="Ej: Conferencia 2026">
        </div>
      </section>

      <!-- Panel Preinvitados (Visibilidad según modo) -->
      <section id="grouppreinvitados" class="card hidden">
        <h2>Búsqueda de Preinvitados</h2>
        <div class="form-group">
          <input type="text" id="buscarPreinvitado" placeholder="Buscar por Nombre o DNI...">
        </div>
      </section>

      <!-- Control de Escáner QR / DNI -->
      <section class="card">
        <h2>Escanear QR / DNI</h2>
        <div id="qr-reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
        <p id="qrStatus" class="status-text"></p>
        <div class="btn-group">
          <button type="button" id="btnStartQR" class="btn btn-primary">Iniciar Cámara</button>
          <button type="button" id="btnStopQR" class="btn btn-secondary" style="display:none;">Detener Cámara</button>
        </div>
      </section>

      <!-- Formulario Principal -->
      <form id="formVisita" class="card">
        <h2>Datos del Visitante</h2>

        <div class="form-group">
          <label for="sector">Sector:</label>
          <select id="sector" required>
            <option value="">Seleccione un sector...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="anfitrion">Anfitrión / Contacto:</label>
          <select id="anfitrion" required>
            <option value="">Seleccione anfitrión...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dni">DNI / Documento:</label>
          <input type="text" id="dni" placeholder="Número de documento" required>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" placeholder="Nombre y Apellido" required>
        </div>

        <div class="form-group">
          <label for="empresa">Empresa / Procedencia:</label>
          <input type="text" id="empresa" placeholder="Empresa u Organización">
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-success">Guardar Visita</button>
          <button type="button" id="btnWhatsApp" class="btn btn-whatsapp" style="display:none;">Enviar WhatsApp</button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
